# Shared: sign-in → library.
# clearState drops a restored session / app-lock flag from a prior device run.
# Credentials match src/dev/demo-credentials.ts (create/refresh with npm run seed:dev).
# Memory auth also accepts these; a Supabase-baked device build needs the seeded user.
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
# SSO controls (visibility only — full OAuth / Apple sheet not automated).
- assertVisible:
    id: "sign-in-google"
- assertVisible:
    id: "sign-in-apple"
- tapOn:
    id: "sign-in-email"
- inputText: "dev@reckoner.local"
- tapOn:
    id: "sign-in-password"
- inputText: "reckoner-dev-1"
- tapOn:
    id: "sign-in-submit"
# iOS password Autofill sheet (if it still appears) — ignore when absent.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- assertVisible:
    id: "library-screen"
