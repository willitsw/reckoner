# Full native smoke: sign in → create process → run a step → sign out.
# Requires Maestro CLI + a device/simulator with the native app (npm start / npx expo run:ios --device).
appId: ${MAESTRO_APP_ID}
---
- runFlow: flows/sign-in.yaml
- assertVisible:
    id: "library-empty"
- tapOn:
    id: "library-new-process"
- assertVisible:
    id: "process-screen"
- tapOn:
    id: "process-title"
- eraseText
- inputText: "Pack camera"
- tapOn:
    id: "process-dismiss-keyboard"
- tapOn:
    id: "process-new-step"
- inputText: "Charge batteries"
- tapOn:
    id: "process-add-step"
- assertVisible: "Charge batteries"
- tapOn:
    id: "process-run"
- assertVisible:
    id: "run-screen"
- assertVisible:
    id: "run-progress"
- tapOn: "Charge batteries"
- assertVisible: "1 of 1"
- tapOn:
    id: "run-done"
- assertVisible:
    id: "process-screen"
- tapOn: "Library"
- assertVisible:
    id: "library-screen"
- tapOn:
    id: "tab-account"
- assertVisible:
    id: "account-screen"
- scrollUntilVisible:
    element:
      id: "account-sign-out"
- tapOn:
    id: "account-sign-out"
- assertVisible:
    id: "sign-in-screen"
